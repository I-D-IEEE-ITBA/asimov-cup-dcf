;* **************************************************************************************
   
    ; @file        platformio.ini
    ; @brief       PlatformIO project configuration for Asimov Cup dual score display
    ; @author      IEEE-ITBA | I+D | S. Lopez, A. Heir, J. Torino, I. Dib, J. Pérez
    ; @date        2025-05-31
    ; @version     2.0
    ; @note        Configuration for Arduino Nano ATmega328P with FastLED library support
    ;              Build flags and monitor settings optimized for debug output
    ; @cite        https://docs.platformio.org/page/projectconf.html

;* **************************************************************************************


;* **************************************************************************************
;*  PROJECT CONFIGURATION
;* **************************************************************************************

;* ENVIRONMENT

[env:nanoatmega328]

platform = atmelavr                    ; AVR platform for Arduino compatibility
board = nanoatmega328                  ; Arduino Nano with ATmega328P microcontroller

; upload_port = COM3                   ; Specify upload port
; upload_speed = 57600                 ; Custom upload speed

framework = arduino                    ; Arduino framework for easy development
; test_framework = unity               ; Unit testing framework


;* LIBRARY DEPENDENCIES

lib_deps = fastled/FastLED@^3.7.0      ; FastLED library for WS2812B LED control


;* BUILD AND DEBUG CONFIGURATION

build_flags =
    -DBAUD_RATE=115200                 ; Serial communication baud rate definition
;   -Os                                ; Optimize for size
;   -DNDEBUG                           ; Disable debug assertions

monitor_speed = 115200                 ; Serial monitor speed (matches BAUD_RATE)

; test_build_project_src = true        ; Include project source in tests
